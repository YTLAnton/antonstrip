<html lang="zh-TW">

<head>

  <meta name="description" content="2026/05/22 - 05/24 (3天2夜)">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;600;700&display=swap" rel="stylesheet">
  <title>新加坡慶生行</title>
  <style>
    *,
    *::before,
    *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    * {
      -webkit-tap-highlight-color: transparent;
    }

    button,
    a {
      outline: none;
    }

    button,
    [data-action] {
      touch-action: manipulation;
    }

    :root {
      --primary: #0891b2;
      --primary-dark: #0e7490;
      --primary-light: rgba(8, 145, 178, 0.2);
      --accent: #d97706;
      --accent-light: rgba(217, 119, 6, 0.15);
      --bg: #121212;
      --surface: #1e1e1e;
      --text: #e5e5e5;
      --text-2: #a3a3a3;
      --text-3: #737373;
      --border: #333333;
      --shadow: 0 1px 3px rgba(0, 0, 0, 0.5);
      --shadow-md: 0 4px 12px rgba(0, 0, 0, 0.7);
      --r: 10px;
      --r-sm: 7px;
      --type-行程: #5eead4;
      --type-行程-bg: rgba(45, 212, 191, 0.15);
      --type-飲食: #fdba74;
      --type-飲食-bg: rgba(251, 146, 60, 0.15);
      --type-交通: #93c5fd;
      --type-交通-bg: rgba(96, 165, 250, 0.15);
      --type-作業: #c4b5fd;
      --type-作業-bg: rgba(167, 139, 250, 0.15);
      --type-住宿: #fcd34d;
      --type-住宿-bg: rgba(251, 191, 36, 0.15);
      --type-景點: #fb923c;
      --type-景點-bg: rgba(251, 146, 60, 0.15);
      --type-參考: #a78bfa;
      --type-參考-bg: rgba(139, 92, 246, 0.15);
      --type-休息: #94a3b8;
      --type-休息-bg: rgba(148, 163, 184, 0.15);
      --type-展覽: #f9a8d4;
      --type-展覽-bg: rgba(249, 168, 212, 0.15);
      --type-購物: #6ee7b7;
      --type-購物-bg: rgba(110, 231, 183, 0.15);
    }

    html,
    body {
      height: 100%;
      font-family: "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", sans-serif;
      scrollbar-width: none;
    }

    html::-webkit-scrollbar,
    body::-webkit-scrollbar {
      display: none;
    }

    body {
      background: var(--bg);
      background-image:
        linear-gradient(rgba(255, 255, 255, 0.025) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255, 255, 255, 0.025) 1px, transparent 1px);
      background-size: 32px 32px;
      display: flex;
      justify-content: center;
      color: var(--text);
      font-size: 14px;
      line-height: 1.5;
    }

    #app {
      width: 100%;
      min-height: 100dvh;
      background: var(--bg);
      position: relative;
      overflow-x: hidden;
      display: flex;
      flex-direction: column;
    }

    /* 桌機：維持手機比例置中，補回深色背景 */
    @media (min-width: 480px) {
      body {
        background: #000000;
      }

      #app {
        max-width: 430px;
      }
    }

    /* ── Header ── */
    #header {
      background: linear-gradient(135deg, #0c1a20, #0e4f60 70%, #0891b2);
      color: white;
      padding: calc(env(safe-area-inset-top) + 14px) 16px 12px;
      position: sticky;
      top: 0;
      z-index: 100;
      transition: padding 0.2s;
    }

    #header.compact {
      padding-bottom: 8px;
    }

    #header-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    #header-title {
      font-size: 1.3rem;
      font-weight: 700;
      letter-spacing: 0.02em;
      font-family: inherit;
    }

    #header-subtitle {
      font-size: 0.75rem;
      opacity: 0.85;
      margin-top: 2px;
    }

    #header-badges {
      display: flex;
      flex-direction: column;
      gap: 5px;
      margin-top: 8px;
    }

    .badges-row {
      display: flex;
      flex-wrap: wrap;
      gap: 5px;
    }

    .badge-people {
      background: rgba(255, 255, 255, 0.22);
      border-radius: 99px;
      padding: 2px 9px;
      font-size: 0.7rem;
      font-weight: 600;
    }

    .badge-keyword {
      background: transparent;
      border: 1px solid rgba(255, 255, 255, 0.4);
      border-radius: 99px;
      padding: 2px 9px;
      font-size: 0.68rem;
      font-weight: 400;
      opacity: 0.85;
    }

    #header.compact #header-subtitle,
    #header.compact #header-badges {
      display: none;
    }

    #search-wrap {
      margin-top: 8px;
      position: relative;
    }

    #header.compact #search-wrap {
      margin-top: 6px;
    }

    #search-input {
      width: 100%;
      background: rgba(255, 255, 255, 0.18);
      border: none;
      border-radius: 8px;
      padding: 7px 32px 7px 10px;
      color: white;
      font-size: 0.82rem;
      outline: none;
    }

    #search-input::placeholder {
      color: rgba(255, 255, 255, 0.6);
    }

    #search-clear {
      position: absolute;
      right: 8px;
      top: 50%;
      transform: translateY(-50%);
      background: none;
      border: none;
      color: rgba(255, 255, 255, 0.7);
      font-size: 1rem;
      cursor: pointer;
      display: none;
    }

    #search-results {
      position: absolute;
      left: 0;
      right: 0;
      top: 100%;
      margin-top: 4px;
      background: var(--surface);
      border-radius: var(--r);
      box-shadow: var(--shadow-md);
      max-height: 300px;
      overflow-y: auto;
      z-index: 200;
      display: none;
    }

    .search-item {
      padding: 10px 14px;
      border-bottom: 1px solid var(--border);
      cursor: pointer;
      font-size: 0.82rem;
      color: var(--text);
    }

    .search-item:last-child {
      border-bottom: none;
    }

    .search-item:hover {
      background: var(--bg);
    }

    .search-item-label {
      font-size: 0.7rem;
      color: var(--text-3);
      margin-bottom: 2px;
    }

    /* ── Tab Bar ── */
    #tab-bar {
      display: flex;
      background: var(--surface);
      border-top: 1px solid var(--border);
      position: sticky;
      bottom: 0;
      z-index: 100;
      padding-bottom: env(safe-area-inset-bottom);
    }

    .tab-btn {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 8px 2px 6px;
      background: none;
      border: none;
      cursor: pointer;
      font-size: 0.6rem;
      color: var(--text-3);
      gap: 2px;
      transition: color 0.15s;
    }

    .tab-btn .tab-icon {
      font-size: 1.3rem;
    }

    .tab-btn.active {
      color: var(--primary);
    }

    /* ── Main Content ── */
    #main {
      flex: 1;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
    }

    .tab-panel {
      display: none;
      padding-bottom: 16px;
    }

    .tab-panel.active {
      display: block;
    }

    /* ── Day Selector ── */
    #day-selector {
      display: flex;
      gap: 8px;
      padding: 12px 16px;
      overflow-x: auto;
      -webkit-overflow-scrolling: touch;
      scrollbar-width: none;
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      flex-shrink: 0;
    }

    #day-selector::-webkit-scrollbar {
      display: none;
    }

    .day-btn {
      flex-shrink: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 6px 12px;
      border-radius: var(--r);
      border: 1.5px solid var(--border);
      background: var(--surface);
      cursor: pointer;
      min-width: 52px;
      gap: 2px;
      transition: all 0.15s;
    }

    .day-btn .day-n {
      font-size: 0.65rem;
      color: var(--text-3);
      font-weight: 600;
    }

    .day-btn .day-date {
      font-size: 0.78rem;
      font-weight: 700;
      color: var(--text);
    }

    .day-btn .day-wd {
      font-size: 0.62rem;
      color: var(--text-3);
    }

    .day-btn.active {
      background: var(--primary);
      border-color: var(--primary);
    }

    .day-btn.active .day-n,
    .day-btn.active .day-date,
    .day-btn.active .day-wd {
      color: white;
    }

    .day-btn.today {
      border-color: var(--primary);
    }

    .day-btn.today .day-date {
      color: var(--primary);
    }

    /* ── Day Content ── */
    #day-content {
      padding: 12px 12px 0;
    }

    .day-header {
      padding: 0 4px 8px;
    }

    .day-header-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }

    .expand-all-btn {
      flex-shrink: 0;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--r-sm);
      width: 30px;
      height: 30px;
      cursor: pointer;
      color: var(--text-2);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 0;
    }

    .expand-all-btn svg {
      width: 16px;
      height: 16px;
    }

    .day-route {
      font-size: 0.78rem;
      color: var(--text-2);
      display: flex;
      align-items: center;
      gap: 5px;
    }

    .day-note {
      margin: 6px 0 10px;
      padding: 8px 10px;
      background: var(--accent-light);
      border-radius: var(--r-sm);
      font-size: 0.78rem;
      color: var(--accent);
      border-left: 3px solid var(--accent);
    }

    /* ── Weather ── */
    .weather-bar {
      background: var(--surface);
      border-radius: var(--r);
      padding: 10px 12px;
      margin-bottom: 10px;
      border: 1px solid var(--border);
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .weather-temp {
      font-size: 1.1rem;
      font-weight: 700;
      color: var(--primary);
    }

    .weather-info {
      flex: 1;
    }

    .weather-cond {
      font-size: 0.78rem;
      color: var(--text);
    }

    .weather-tips {
      font-size: 0.7rem;
      color: var(--text-2);
      margin-top: 2px;
    }

    /* ── Activity Card ── */
    .activity-card {
      background: var(--surface);
      border-radius: var(--r);
      border: 1.5px solid var(--border);
      margin-bottom: 8px;
      overflow: hidden;
      transition: box-shadow 0.15s, transform 0.2s;
    }

    @media (hover: hover) {
      .activity-card:hover {
        transform: translateY(-1px);
        box-shadow: 0 4px 16px rgba(0, 0, 0, 0.45);
      }
    }

    .activity-card.cancelled-card {
      opacity: 0.6;
    }

    .card-header {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 10px 12px;
      cursor: pointer;
    }

    .card-header.no-expand {
      cursor: default;
    }

    .card-header.no-expand .card-chevron {
      display: none;
    }

    .card-icon {
      font-size: 1.1rem;
      flex-shrink: 0;
    }

    .card-meta {
      flex: 1;
      min-width: 0;
    }

    .card-time {
      font-size: 0.68rem;
      color: var(--primary);
      font-variant-numeric: tabular-nums;
    }

    .card-name {
      font-size: 0.88rem;
      font-weight: 600;
    }

    .card-name.cancelled-text {
      text-decoration: line-through;
    }

    .card-tags {
      display: flex;
      gap: 4px;
      margin-top: 3px;
      flex-wrap: wrap;
    }

    .tag-type {
      font-size: 0.62rem;
      font-weight: 600;
      padding: 1px 6px;
      border-radius: 99px;
      white-space: nowrap;
    }

    .tag-cost {
      font-size: 0.62rem;
      font-weight: 600;
      padding: 1px 6px;
      border-radius: 99px;
      background: rgba(253, 224, 71, 0.15);
      color: #fce726;
    }

    .card-chevron {
      color: var(--text-3);
      font-size: 0.8rem;
      flex-shrink: 0;
      transition: transform 0.2s;
    }

    .card-chevron.open {
      transform: rotate(90deg);
    }

    .card-body {
      padding: 0 12px 12px;
      display: none;
      border-top: 1px solid var(--border);
      padding-top: 10px;
    }

    .card-body.open {
      display: block;
    }

    .card-desc {
      font-size: 0.82rem;
      color: var(--text);
      margin-bottom: 8px;
      line-height: 1.55;
    }

    .card-hours {
      font-size: 0.72rem;
      color: var(--text-2);
      margin-bottom: 6px;
    }

    .ticket-box {
      background: rgba(234, 88, 12, 0.1);
      border: 1px solid rgba(234, 88, 12, 0.3);
      border-radius: var(--r-sm);
      padding: 7px 10px;
      margin-bottom: 8px;
      font-size: 0.78rem;
      color: #fdba74;
    }

    .meta-box {
      background: rgba(202, 138, 4, 0.1);
      border: 1px solid rgba(202, 138, 4, 0.3);
      border-radius: var(--r-sm);
      padding: 7px 10px;
      margin-bottom: 8px;
      font-size: 0.78rem;
      color: #fde047;
      font-weight: 500;
    }

    .notes-box {
      border-left: 3px solid var(--accent);
      padding: 7px 10px;
      background: rgba(255, 255, 255, 0.04);
      border-radius: 0 var(--r-sm) var(--r-sm) 0;
      margin-bottom: 8px;
      font-size: 0.78rem;
      color: var(--text-2);
      line-height: 1.5;
    }

    .copyable-box {
      background: rgba(34, 197, 94, 0.1);
      border: 1px solid rgba(34, 197, 94, 0.3);
      border-radius: var(--r-sm);
      padding: 7px 10px;
      margin-bottom: 8px;
      font-size: 0.78rem;
      color: #86efac;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .copyable-box:hover {
      background: rgba(34, 197, 94, 0.2);
    }

    .copy-icon {
      font-size: 0.9rem;
      opacity: 0.6;
    }

    .card-buttons {
      display: flex;
      gap: 6px;
      margin-top: 8px;
      flex-wrap: wrap;
    }

    .btn-map {
      flex: 1;
      min-width: 120px;
      padding: 7px 10px;
      border-radius: var(--r-sm);
      background: var(--primary);
      color: white;
      border: none;
      cursor: pointer;
      font-size: 0.78rem;
      font-weight: 600;
      text-align: center;
    }

    .btn-driver {
      flex: 1;
      min-width: 100px;
      padding: 7px 10px;
      border-radius: var(--r-sm);
      background: var(--surface);
      color: var(--text);
      border: 1.5px solid var(--border);
      cursor: pointer;
      font-size: 0.78rem;
      font-weight: 600;
      text-align: center;
    }

    .note-textarea {
      width: 100%;
      margin-top: 8px;
      padding: 7px 10px;
      border: 1.5px solid var(--border);
      border-radius: var(--r-sm);
      font-size: 0.78rem;
      resize: vertical;
      min-height: 56px;
      font-family: inherit;
      color: var(--text);
      outline: none;
      background: var(--surface);
    }

    .note-textarea:focus {
      border-color: var(--primary);
    }

    .btn-app {
      display: block;
      width: 100%;
      margin-top: 8px;
      padding: 8px 10px;
      border-radius: var(--r-sm);
      font-size: 0.8rem;
      font-weight: 700;
      text-align: center;
      text-decoration: none;
      letter-spacing: 0.02em;
    }

    .btn-doc {
      display: inline-block;
      margin-bottom: 8px;
      padding: 6px 12px;
      border-radius: var(--r-sm);
      background: rgba(59, 130, 246, 0.1);
      color: #93c5fd;
      border: 1.5px solid rgba(59, 130, 246, 0.3);
      font-size: 0.78rem;
      font-weight: 600;
      text-decoration: none;
    }

    /* ── Accommodation ── */
    .accommodation-section {
      margin-bottom: 8px;
      background: var(--surface);
      border-radius: var(--r);
      border: 1.5px solid var(--border);
      overflow: hidden;
    }

    .accom-header {
      padding: 10px 12px;
      display: flex;
      align-items: center;
      gap: 8px;
      cursor: pointer;
    }

    .accom-title {
      font-size: 0.88rem;
      font-weight: 700;
      color: var(--text);
    }

    .accom-sub {
      font-size: 0.7rem;
      color: var(--text-2);
      margin-top: 2px;
    }

    .accom-body {
      padding: 10px 12px;
      display: none;
    }

    .accom-body.open {
      display: block;
    }

    .accom-row {
      display: flex;
      justify-content: space-between;
      padding: 4px 0;
      font-size: 0.8rem;
      border-bottom: 1px solid var(--border);
    }

    .accom-row:last-of-type {
      border-bottom: none;
    }

    .accom-label {
      color: var(--text-2);
    }

    .accom-val {
      font-weight: 600;
    }

    /* ── Cancelled ── */
    .cancelled-section {
      margin-top: 12px;
    }

    .cancelled-toggle {
      padding: 8px 12px;
      background: rgba(255, 255, 255, 0.04);
      border-radius: var(--r);
      border: 1.5px dashed var(--border);
      cursor: pointer;
      font-size: 0.75rem;
      color: var(--text-3);
      text-align: center;
    }

    /* ── Day Note ── */
    .day-note-section {
      margin-top: 16px;
      padding: 0 4px;
    }

    .day-note-label {
      font-size: 0.72rem;
      color: var(--text-3);
      margin-bottom: 4px;
      font-weight: 600;
    }

    /* ── Glow ── */
    @keyframes cardGlow {

      0%,
      100% {
        box-shadow: var(--shadow);
        border-color: var(--border);
      }

      50% {
        box-shadow: 0 0 15px rgba(192, 57, 43, 0.35);
        border-color: var(--primary);
      }
    }

    .card-glow {
      animation: cardGlow 1.5s ease-in-out 2;
    }

    /* ── Food Tab ── */
    .section-header {
      padding: 14px 16px 6px;
      font-size: 0.72rem;
      font-weight: 700;
      color: var(--text-3);
      text-transform: uppercase;
      letter-spacing: 0.08em;
    }

    .food-city {
      margin: 0 12px 8px;
    }

    .food-city-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 10px 12px;
      background: var(--surface);
      border-radius: var(--r);
      border: 1.5px solid var(--border);
      cursor: pointer;
      margin-bottom: 2px;
    }

    .food-city-name {
      font-size: 0.9rem;
      font-weight: 700;
    }

    .food-city-count {
      font-size: 0.7rem;
      color: var(--text-3);
    }

    .food-list {
      display: none;
    }

    .food-list.open {
      display: block;
    }

    .food-item {
      display: flex;
      align-items: flex-start;
      gap: 10px;
      padding: 9px 12px;
      background: var(--surface);
      border: 1.5px solid var(--border);
      border-top: none;
      cursor: pointer;
    }

    .food-item:last-child {
      border-radius: 0 0 var(--r) var(--r);
    }

    .food-item-info {
      flex: 1;
      min-width: 0;
    }

    .food-name {
      font-size: 0.82rem;
      font-weight: 600;
    }

    .food-en {
      font-size: 0.7rem;
      color: var(--text-3);
    }

    .food-note {
      font-size: 0.72rem;
      color: var(--text-2);
      margin-top: 2px;
    }

    .food-price {
      font-size: 0.7rem;
      color: #fce726;
      background: rgba(253, 224, 71, 0.15);
      padding: 2px 6px;
      border-radius: 99px;
      white-space: nowrap;
      align-self: flex-start;
      margin-top: 2px;
    }

    .food-map-btn {
      font-size: 0.85rem;
      color: var(--primary);
      flex-shrink: 0;
      align-self: center;
    }

    /* ── Flight Tab ── */
    .flight-group {
      margin: 0 12px 12px;
    }

    .flight-group-title {
      font-size: 0.78rem;
      font-weight: 700;
      color: var(--text-2);

  <script>
    // ── Parser ──────────────────────────────────────────────
    const raw = document.getElementById('trip-data').textContent.trim();

    function parseFrontmatter(text) {
      const m = text.match(/^---\n([\s\S]*?)\n---/);
      if (!m) return { config: {}, body: text };
      const fm = m[1]; const body = text.slice(m[0].length).trim();
      const config = {};
      const lines = fm.split('\n');
      let i = 0;
      while (i < lines.length) {
        const line = lines[i];
        const kv = line.match(/^(\w+):\s*(.*)/);
        if (!kv) { i++; continue; }
        const key = kv[1]; const val = kv[2].trim();
        if (val === '') {
          // nested object
          const obj = {};
          i++;
          while (i < lines.length && lines[i].match(/^\s+/)) {
            const inner = lines[i].trim();
            const innerKey = inner.match(/^(\S+):/);
            if (innerKey) {
              const subKey = innerKey[1];
              const subObj = {};
              i++;
              while (i < lines.length && lines[i].match(/^\s{4,}/)) {
                const sub = lines[i].trim();
                const sm = sub.match(/^(\w+):\s*(.*)/);
                if (sm) subObj[sm[1]] = sm[2].replace(/"/g, '').trim();
                i++;
              }
              obj[subKey] = subObj;
            } else { i++; }
          }
          config[key] = obj;
        } else if (val.startsWith('[')) {
          config[key] = val.slice(1, -1).split(',').map(s => s.trim().replace(/"/g, ''));
          i++;
        } else {
          config[key] = isNaN(val) ? val.replace(/"/g, '') : Number(val);
          i++;
        }
      }
      return { config, body };
    }

    function parseKeyValues(lines) {
      const obj = {};
      for (const line of lines) {
        const m = line.match(/^(\w+):\s*([\s\S]*)/);
        if (m) {
          const k = m[1], v = m[2].trim();
          if (k === 'cancelled') obj[k] = v === 'true';
          else if (k === 'nights') obj[k] = parseInt(v);
          else obj[k] = v;
        }
      }
      return obj;
    }

    function parseDayBlock(block) {
      // header line: ## Day N | YYYY/MM/DD (wd) | title  OR  ## Day N | title
      const headerLine = block.split('\n')[0];
      const hmFull = headerLine.match(/##\s*Day\s*(\d+)\s*\|\s*(\d{4}\/\d{2}\/\d{2})\s*\(([^)]+)\)\s*\|\s*(.*)/);
      const hmShort = !hmFull && headerLine.match(/##\s*Day\s*(\d+)\s*\|\s*(.*)/);
      if (!hmFull && !hmShort) return null;
      const dayNum = parseInt(hmFull ? hmFull[1] : hmShort[1]);
      const date = hmFull ? hmFull[2] : '';
      const weekday = hmFull ? hmFull[3].trim() : '';
      const title = hmFull ? hmFull[4].trim() : hmShort[2].trim();
      const day = { day: dayNum, date, weekday, title, route: '', dayNote: '', weather: null, activities: [], accommodation: null };

      const rest = block.split('\n').slice(1);
      // parse route/dayNote/weather before first ###
      let i = 0;
      while (i < rest.length && !rest[i].startsWith('###')) {
        const rkv = rest[i].match(/^(\w+):\s*(.*)/);
        if (rkv) {
          if (rkv[1] === 'route') day.route = rkv[2].trim();
          if (rkv[1] === 'dayNote') day.dayNote = rkv[2].trim();
          if (rkv[1] === 'weatherTemp') { if (!day.weather) day.weather = {}; day.weather.temp = rkv[2].trim(); }
          if (rkv[1] === 'weatherCond') { if (!day.weather) day.weather = {}; day.weather.condition = rkv[2].trim(); }
          if (rkv[1] === 'weatherRain') { if (!day.weather) day.weather = {}; day.weather.rain = rkv[2].trim(); }
          if (rkv[1] === 'weatherTips') { if (!day.weather) day.weather = {}; day.weather.tips = rkv[2].trim(); }
        }
        i++;
      }
      // parse ### sections
      const actBlocks = rest.slice(i).join('\n').split(/(?=^###)/m).filter(s => s.trim());
      for (const ab of actBlocks) {
        const aLines = ab.trim().split('\n');
        const headerLine = aLines[0];

        // 人名區塊：### Name（沒有 | 符號）
        if (!headerLine.includes('|')) {
          const personName = headerLine.replace(/^###\s*/, '').trim();
          if (!personName) continue;
          for (const line of aLines.slice(1)) {
            const itemM = line.match(/^-\s*([^|]+)\|\s*(.*)/);
            if (!itemM) continue;
            day.activities.push({ type: itemM[1].trim(), nameCn: itemM[2].trim(), person: personName });
          }
          continue;
        }

        // 一般項目：### type | name
        const aHeader = headerLine.match(/###\s*([^|]+)\|\s*(.*)/);
        if (!aHeader) continue;
        const type = aHeader[1].trim();
        const name = aHeader[2].trim();
        const kvObj = parseKeyValues(aLines.slice(1));
        day.activities.push({ type, nameCn: name, ...kvObj });
      }
      return day;
    }

    function parseFoodBlock(block) {
      const lines = block.split('\n').slice(1);
      const groups = [];
      let current = null;
      for (const line of lines) {
        const cityM = line.match(/^###\s*(.+?)（([^）]+)）/);
        if (cityM) {
          current = { city: cityM[1].trim(), days: cityM[2].trim(), items: [] };
          groups.push(current); continue;
        }
        if (line.startsWith('- ') && current) {
          const parts = line.slice(2).split('|').map(s => s.trim());
          // "中文名 英文名 | note | price" or "中文名 | note | price"
          const nameRaw = parts[0] || '';
          const enM = nameRaw.match(/^([\u4e00-\u9fff\s]+)([\w\s]+)?$/);
          let nameCn = nameRaw, nameEn = '';
          if (enM && enM[2]) { nameCn = enM[1].trim(); nameEn = enM[2].trim(); }
          // try split on space between CJK and latin
          const spaceM = nameRaw.match(/^([\u4e00-\u9fff，。、\s]+)\s([A-Z].*)$/);
          if (spaceM) { nameCn = spaceM[1].trim(); nameEn = spaceM[2].trim(); }
          current.items.push({ name: nameCn, nameEn, note: parts[1] || '', price: parts[2] || '' });
        }
      }
      return groups;
    }

    function parseFlightsBlock(block) {
      const lines = block.split('\n').slice(1);
      const routes = [];
      let current = null;
      for (const line of lines) {
        if (line.startsWith('### ')) {
          current = { label: line.slice(4).trim(), legs: [], cost: '' };
          routes.push(current); continue;
        }
        if (!current) continue;
        if (line.startsWith('- 費用：')) { current.cost = line.slice(5).trim(); continue; }
        if (line.startsWith('- ')) {
          // 例: CX456 | 台北(TPE) → 大阪(KIX) | 08:00 → 12:00 | 飛行 3h00m
          const parts = line.slice(2).split('|').map(s => s.trim());
          if (parts.length < 3) continue;
          const flight = parts[0];
          const routeM = parts[1].match(/(.+?)\((\w+)\)\s*→\s*(.+?)\((\w+)\)/);
          const timeM = parts[2].match(/(\d{2}:\d{2})\s*→\s*(\d{2}:\d{2})/);
          const duration = (parts[3] || '').replace('飛行 ', '').trim();
          if (routeM && timeM) {
            current.legs.push({
              flight, from: routeM[1].trim(), fromCode: routeM[2],
              to: routeM[3].trim(), toCode: routeM[4],
              depart: timeM[1], arrive: timeM[2], duration
            });
          }
        }
      }
      return { routes };
    }

    function parsePackingBlock(block) {
      const lines = block.split('\n').slice(1);
      const cats = [];
      let current = null;
      for (const line of lines) {
        const catM = line.match(/^###\s*(.+)/);
        if (catM) {
          const raw = catM[1].trim();
          const iconM = raw.match(/^([\p{Emoji}]+)\s*(.*)/u);
          current = { cat: iconM ? iconM[2].trim() : raw, icon: iconM ? iconM[1] : '📦', items: [] };
          cats.push(current); continue;
        }
        if (line.startsWith('- ') && current) {
          current.items.push({ item: line.slice(2).trim() });
        }
      }
      return cats;
    }

    function parseTipsBlock(block) {
      const lines = block.split('\n').slice(1);
      const sections = [];
      let current = null;
      for (const line of lines) {
        if (line.startsWith('### ')) {
          current = { title: line.slice(4).trim(), items: [] };
          sections.push(current); continue;
        }
        if (!current) continue;
        if (line.startsWith('- ')) current.items.push(line.slice(2).trim());
        else if (line.trim()) current.items.push(line.trim());
      }
      return { sections };
    }

    // ── Main parse ──────────────────────────────────────────
    const { config, body } = parseFrontmatter(raw);

    const blocks = body.split(/^(?=##\s)/m).filter(s => s.trim());
    const DATA = {
      ...config,
      days: [], food: [], flights: { routes: [] }, packingList: [], packingTips: { sections: [] }, tips: { sections: [] }
    };

    for (const block of blocks) {
      const firstLine = block.trim().split('\n')[0];
      if (firstLine.match(/##\s*Day\s*\d+/)) {
        const d = parseDayBlock(block.trim());
        if (d) DATA.days.push(d);
      } else if (firstLine.includes('美食清單')) {
        DATA.food = parseFoodBlock(block.trim());
      } else if (firstLine.includes('航班資訊')) {
        DATA.flights = parseFlightsBlock(block.trim());
      } else if (firstLine.includes('行李清單')) {
        DATA.packingList = parsePackingBlock(block.trim());
      } else if (firstLine.includes('打包提醒')) {
        DATA.packingTips = parseTipsBlock(block.trim());
      } else if (firstLine.includes('旅遊須知')) {
        DATA.tips = parseTipsBlock(block.trim());
      }
    }

    // ── Sort activities by time ──────────────────────────────
    function actTime(a) {
      const t = a.time || (a.type === '住宿' ? a.checkIn : null);
      if (!t) return null;
      const [h, m] = t.split(':').map(Number);
      return h * 60 + (m || 0);
    }
    DATA.days.forEach(day => {
      day.activities.sort((a, b) => {
        const ta = actTime(a), tb = actTime(b);
        if (ta === null && tb === null) return 0;
        if (ta === null) return 1;
        if (tb === null) return -1;
        return ta - tb;
      });
    });

    // ── Helpers ─────────────────────────────────────────────
    function escHtml(s) {
      if (!s) return '';
      return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
    }

    function typeIcon(act) {
      if (act.type === '行程') return '🎯';
      if (act.type === '景點') return '📸';
      if (act.type === '飲食') return '🍽️';
      if (act.type === '作業') return '📋';
      if (act.type === '參考') return '💡';
      if (act.type === '住宿') return '🏠';
      if (act.type === '休息') return '😴';
      if (act.type === '展覽') return '🖼️';
      if (act.type === '購物') return '🛍️';
      // 交通 — detect
      const t = (act.nameCn + ' ' + (act.description || '')).toLowerCase();
      if (/搭機|飛機|航班|ci\d|br\d|sin|tpe/.test(t)) return '✈️';
      if (/mrt|地鐵/.test(t)) return '🚇';
      if (/grab|計程車|uber/.test(t)) return '🚕';
      if (/步行|散步/.test(t)) return '🚶';
      return '🚗';
    }

    function typeColor(type) {
      const map = { '行程': '行程', '景點': '景點', '飲食': '飲食', '交通': '交通', '作業': '作業', '住宿': '住宿', '參考': '參考', '休息': '休息', '展覽': '展覽', '購物': '購物' };
      return map[type] || '行程';
    }

    function mapsUrl(act) {
      if (act.mapLink) return act.mapLink;
      if (act.address) return `https://maps.google.com/?q=${encodeURIComponent(act.address)}`;
      return null;
    }

    // ── App Deep Link Button ─────────────────────────────────
    const APP_MAP = {
      '台鐵': { label: '🚂 台鐵 e 訂通', url: 'traeticket://', bg: '#1a6b3a', color: '#fff' },
      '高鐵': { label: '🚄 T-Express 高鐵', url: 'texpress://', bg: '#e65100', color: '#fff' },
      '長榮航空': { label: '✈️ 長榮航空', url: 'evaair://', bg: '#005f40', color: '#fff' },
      '國泰航空': { label: '✈️ 國泰航空', url: 'https://www.cathaypacific.com/', bg: '#006564', color: '#fff' },
      'Agoda': { label: '🏨 Agoda', url: 'agoda://', bg: '#5c2d91', color: '#fff' },
      'Grab': { label: '🚗 Grab', url: 'grab://', bg: '#00b14f', color: '#fff' },
    };

    // ── 文字標記處理 ─────────────────────────────────────────
    function renderText(raw) {
      if (!raw) return '';
      const parts = [];
      let last = 0;
      const re = /==([\s\S]+?)==|~~([\s\S]+?)~~/g;
      let m;
      while ((m = re.exec(raw)) !== null) {
        parts.push(escHtml(raw.slice(last, m.index)));
        if (m[1] !== undefined) parts.push(`<span class="hl-y">${escHtml(m[1])}</span>`);
        if (m[2] !== undefined) parts.push(`<span class="hl-p">${escHtml(m[2])}</span>`);
        last = m.index + m[0].length;
      }
      parts.push(escHtml(raw.slice(last)));
      return parts.join('').replace(/\\n/g, '<br>');
    }

    // ── 景點圖片卡 ───────────────────────────────────────────
    function renderImageCard(act) {
      if (!act.imageUrl) return '';
      const imgs = [act.imageUrl, act.imageUrl2, act.imageUrl3].filter(Boolean);
      const label = escHtml(act.nameCn || '');

      const makeWrap = (src, extra) => {
        const safe = escHtml(src);
        return `<div class="si-wrap${extra ? ' ' + extra : ''}" onclick="openLightbox('${safe}')">
        <img src="${safe}" alt="${label}" loading="lazy">
      </div>`;
      };

      if (imgs.length === 1) {
        const cls = act.imageSize === 'small' ? 'si-sm' : '';
        return makeWrap(imgs[0], cls);

      if (imgs.length === 2) {
        return `<div class="si-grid-2">${makeWrap(imgs[0])}${makeWrap(imgs[1])}</div>`;
      }
      return `<div class="si-grid-3">${makeWrap(imgs[0])}<div class="si-row2">${makeWrap(imgs[1])}${makeWrap(imgs[2])}</div></div>`;

      const bg = cfg ? cfg.bg : '#555';
      return `<a href="${escHtml(url)}" class="btn-app" style="background:${bg};color:${cfg ? cfg.color : '#fff'}">${label}</a>`;

    let currentDayIndex = 0;

      el.innerHTML = DATA.days.map((d, i) => {

      <span class="day-n">Day ${d.day}</span>

      <span class="day-n">Day ${d.day}</span>
      <span class="day-date">${d.date.slice(5)}</span>

      }).join('');

      ${(act.nights || act.night) ? `<div class="accom-row"><span class="accom-label">晚數</span><span class="accom-val">${act.nights || act.night} 晚</span></div>` : ''}
      ${act.ticket ? `<div class="ticket-box">🎫 ${renderText(act.ticket)}</div>` : ''}

      ${act.copyable ? `<div class="copyable-box" onclick="copyText('${escHtml(act.copyable)}')" style="margin-top:8px">${escHtml(act.copyable)}<span class="copy-icon">📋</span></div>` : ''}

        ${act.address ? `<button class="btn-driver" onclick="openDriver('${escHtml(act.address)}')">👁 給司機看</button>` : ''}
      </div>

      }

    function togglePrep0(element, dayIdx, actIdx, countId, totalItems) {
      const key = getPrep0Key(dayIdx, actIdx);
      const isChecked = localStorage.getItem(key) === '1';
      const newVal = isChecked ? '0' : '1';
      localStorage.setItem(key, newVal);

      const checkEl = element.querySelector('.pack-check');

        checkEl.classList.add('checked');

      if (countEl) {
        const groupEl = element.closest('.pack-items');

        countEl.textContent = `${done}/${totalItems}`;

    function renderPrep0Groups(actPairs, dayIdx, ns) {
      const groups = {}, groupOrder = [];
      actPairs.forEach(({ act, i }) => {
        const t = act.type || '其他';
        if (!groups[t]) { groups[t] = []; groupOrder.push(t); }
        groups[t].push({ act, i });
      });
      return groupOrder.map((type, gi) => {
        const items = groups[type];
        const done = items.filter(({ i }) => localStorage.getItem(getPrep0Key(dayIdx, i)) === '1').length;
        const countId = `prep0count-${dayIdx}-${ns}-${gi}`;
        return `<div class="pack-cat fade-in-up">
          <div class="pack-cat-header" onclick="togglePrep0Cat('prep0cat-${dayIdx}-${ns}-${gi}','prep0chv-${dayIdx}-${ns}-${gi}')">

          <div class="pack-items open" id="prep0cat-${dayIdx}-${ns}-${gi}">

          const checked = localStorage.getItem(getPrep0Key(dayIdx, i)) === '1';
          return `<div class="pack-item" onclick="togglePrep0(this, ${dayIdx}, ${i}, '${countId}', ${items.length})">
                <div class="pack-check ${checked ? 'checked' : ''}">${checked ? '✓' : ''}</div>

    function renderDay0Checklist(day, dayIdx) {
      if (!day.activities.length) return '<div style="padding:20px;opacity:0.5;text-align:center">尚無項目</div>';

      const persons = [...new Set(day.activities.map(a => a.person).filter(Boolean))];

      if (persons.length < 2) {
        // 0 或 1 個人：不顯示頁籤
        const pairs = day.activities.map((act, i) => ({ act, i }));
        return renderPrep0Groups(pairs, dayIdx, 'all');
      }

      // 多人：頁籤模式
      // 有 person 的項目進各人頁籤，沒有 person 的進「共用」區塊
      const sharedPairs = day.activities.map((act, i) => ({ act, i })).filter(({ act }) => !act.person);

      const tabsHtml = `<div class="prep0-tabs">
        ${persons.map((p, pi) => `<button class="prep0-tab${pi === 0 ? ' active' : ''}" onclick="selectPrep0Tab(${dayIdx}, ${pi}, ${persons.length})">${escHtml(p)}</button>`).join('')}
      </div>`;

      const panelsHtml = persons.map((person, pi) => {
        const pairs = day.activities.map((act, i) => ({ act, i })).filter(({ act }) => act.person === person);
        return `<div id="prep0panel-${dayIdx}-${pi}"${pi > 0 ? ' style="display:none"' : ''}>
          ${pairs.length ? renderPrep0Groups(pairs, dayIdx, `p${pi}`) : '<div style="padding:12px 16px;opacity:0.5;font-size:0.8rem">尚無專屬物品</div>'}
        </div>`;
      }).join('');

      const sharedHtml = sharedPairs.length
        ? `<div class="prep0-shared-label">共用</div>${renderPrep0Groups(sharedPairs, dayIdx, 'shared')}`
        : '';

      return tabsHtml + panelsHtml + sharedHtml;

    function buildRenderQueue(activities) {
      const queue = [];
      let i = 0;
      while (i < activities.length) {
        if (activities[i].group) {
          // 收集連續有 group: 的活動，依 group 值分欄
          const columns = new Map();
          const colOrder = [];
          while (i < activities.length && activities[i].group) {
            const g = activities[i].group;
            if (!columns.has(g)) { columns.set(g, []); colOrder.push(g); }
            columns.get(g).push({ act: activities[i], origIdx: i });
            i++;
          }
          queue.push({ type: 'split', columns: colOrder.map(g => ({ group: g, items: columns.get(g) })) });
        } else {
          queue.push({ type: 'single', act: activities[i], origIdx: i });
          i++;
        }
      }
      return queue;
    }

    // Auto-locate current activity
    // 若今天在行程日期內 → 切換至今日並定位當前時段活動
    // 若今天不在行程日期內 → 顯示 Day 1 最頂端（不捲動）
    function autoLocate() {
      const now = new Date();
      const todayStr = `${now.getFullYear()}/${String(now.getMonth() + 1).padStart(2, '0')}/${String(now.getDate()).padStart(2, '0')}`;
      const dayIdx = DATA.days.findIndex(d => d.date === todayStr);

      // 今天不在行程範圍內 → 顯示 Day 1 最頂端
      if (dayIdx < 0) {
        const fallBackIdx = DATA.days.findIndex(d => d.day === 1);
        selectDay(fallBackIdx >= 0 ? fallBackIdx : 0);
        return;
      }

      // 今天在行程內 → 切換至今日
      selectDay(dayIdx);

      // 找出當前時段對應的活動
      const day = DATA.days[dayIdx];
      const nowMin = now.getHours() * 60 + now.getMinutes();
      const normal = day.activities.filter(a => !a.cancelled);
      let targetIdx = -1;
      for (let i = 0; i < normal.length; i++) {
        const a = normal[i];
        if (!a.time) continue;
        const [h, m] = a.time.split(':').map(Number);
        const actMin = h * 60 + m;
        let nextMin = Infinity;
        for (let j = i + 1; j < normal.length; j++) {
          if (normal[j].time) {
            const [nh, nm] = normal[j].time.split(':').map(Number);
            nextMin = nh * 60 + nm; break;
          }
        }
        if (nowMin >= actMin && nowMin < nextMin) { targetIdx = i; break; }
      }
      if (targetIdx >= 0) {
        setTimeout(() => {
          const card = document.getElementById(`act-${dayIdx}-${targetIdx}`);
          if (card) {
            card.scrollIntoView({ behavior: 'smooth', block: 'center' });
            card.classList.add('card-glow');
            setTimeout(() => card.classList.remove('card-glow'), 3200);
          }
        }, 300);
      }
    }

    // ── Render Packing ────────────────────────────────────────
    function getPackKey(catIdx, itemIdx) { return `pack_${catIdx}_${itemIdx}`; }

    function updatePackProgress() {
      let total = 0, checked = 0;
      DATA.packingList.forEach((cat, ci) => {
        cat.items.forEach((_, ii) => {
          total++;
          if (localStorage.getItem(getPackKey(ci, ii)) === '1') checked++;
        });
      });
      const pct = total ? Math.round(checked / total * 100) : 0;
      document.getElementById('packing-progress').innerHTML = `
    <div class="pack-progress-bar"><div class="pack-progress-fill" style="width:${pct}%"></div></div>
    <div class="pack-progress-label">已打包 ${checked} / ${total} 項（${pct}%）</div>`;
    }

    function togglePackItem(element, ci, ii, countId, total) {
      const k = getPackKey(ci, ii);
      const isChecked = localStorage.getItem(k) === '1';
      const newVal = isChecked ? '0' : '1';
      localStorage.setItem(k, newVal);

      const checkEl = element.querySelector('.pack-check');
      const textEl = element.querySelector('.pack-item-text');
      if (newVal === '1') {
        checkEl.classList.add('checked');
        checkEl.textContent = '✓';
        textEl.classList.add('checked');
      } else {
        checkEl.classList.remove('checked');
        checkEl.textContent = '';
        textEl.classList.remove('checked');
      }

      const countEl = document.getElementById(countId);
      if (countEl) {
        const groupEl = element.closest('.pack-items');
        const done = groupEl.querySelectorAll('.pack-check.checked').length;
        countEl.textContent = `${done}/${total}`;
      }
      updatePackProgress();
    }

    // ── Search ────────────────────────────────────────────────
    function buildSearchIndex() {
      const idx = [];
      DATA.days.forEach((day, di) => {
        day.activities.forEach((act, ai) => {
          idx.push({ text: `${act.nameCn} ${act.nameEn || ''} ${act.description || ''}`, label: `Day ${day.day} · ${act.type}`, name: act.nameCn, tab: 'itinerary', dayIdx: di, actIdx: ai });
        });
      });
      DATA.food.forEach((group) => {
        group.items.forEach(item => {
          idx.push({ text: `${item.name} ${item.nameEn || ''}`, label: `美食 · ${group.city}`, name: item.name, tab: 'food' });
        });
      });
      return idx;
    }
    const searchIndex = buildSearchIndex();

    const searchInput = document.getElementById('search-input');
    const searchResults = document.getElementById('search-results');
    const searchClear = document.getElementById('search-clear');

    searchInput.addEventListener('input', () => {
      const q = searchInput.value.trim().toLowerCase();
      searchClear.style.display = q ? 'block' : 'none';
      if (!q) { searchResults.style.display = 'none'; return; }
      const hits = searchIndex.filter(item => item.text.toLowerCase().includes(q)).slice(0, 8);
      if (!hits.length) { searchResults.style.display = 'none'; return; }
      searchResults.innerHTML = hits.map((h, i) => `
    <div class="search-item" onclick="jumpToResult(${i}, searchHits)">
      <div class="search-item-label">${escHtml(h.label)}</div>
      <div>${escHtml(h.name)}</div>
    </div>`).join('');
      // store hits for onclick
      window.searchHits = hits;
      // fix onclick
      searchResults.querySelectorAll('.search-item').forEach((el, i) => {
        el.onclick = () => jumpToResult(i, hits);
      });
      searchResults.style.display = 'block';
    });

    searchClear.addEventListener('click', () => {
      searchInput.value = ''; searchClear.style.display = 'none';
      searchResults.style.display = 'none';
    });

    document.addEventListener('click', (e) => {
      if (!e.target.closest('#search-wrap')) searchResults.style.display = 'none';
    });

    function jumpToResult(i, hits) {
      const h = hits[i];
      searchResults.style.display = 'none';
      switchTab(h.tab);
      if (h.tab === 'itinerary' && h.dayIdx !== undefined) {
        selectDay(h.dayIdx);
        if (h.actIdx !== undefined) {
          setTimeout(() => {
            const card = document.getElementById(`act-${h.dayIdx}-${h.actIdx}`);
            if (card) {
              card.scrollIntoView({ behavior: 'smooth', block: 'center' });
              const body = document.getElementById(`body-act-${h.dayIdx}-${h.actIdx}`);
              const chv = document.getElementById(`chv-act-${h.dayIdx}-${h.actIdx}`);
              if (!body.classList.contains('open')) { body.classList.add('open'); chv.classList.add('open'); }
            }
          }, 100);
        }
      }
    }

    // ── Header scroll ─────────────────────────────────────────
    let _headerCompact = false;
    document.getElementById('main').addEventListener('scroll', function () {
      const header = document.getElementById('header');
      if (!_headerCompact && this.scrollTop > 60) {
        _headerCompact = true;
        header.classList.add('compact');
      } else if (_headerCompact && this.scrollTop < 20) {
        _headerCompact = false;
        header.classList.remove('compact');
      }
    });

    // ── Init ──────────────────────────────────────────────────
    renderTabBar();
    renderFood();
    renderFlights();
    renderPackingTips();
    renderPacking();
    renderTips();
    // ── 圖片 Lightbox ────────────────────────────────────────
    function openLightbox(src) {
      document.getElementById('lightbox-img').src = src;
      document.getElementById('lightbox').classList.remove('hidden');
      document.body.style.overflow = 'hidden';
    }
    function closeLightbox() {
      document.getElementById('lightbox').classList.add('hidden');
      document.body.style.overflow = '';
    }

    // ── 捲動淡入 ─────────────────────────────────────────────
    function initFadeIn(container) {
      const obs = new IntersectionObserver((entries) => {
        entries.forEach(e => {
          if (e.isIntersecting) { e.target.classList.add('visible'); obs.unobserve(e.target); }
        });
      }, { threshold: 0.05 });
      container.querySelectorAll('.fade-in-up').forEach(el => obs.observe(el));
    }

    renderDaySelector();
    autoLocate(); // 統一負責初始渲染：今天在行程內→定位；不在→顯示 Day 1 頂端
    document.addEventListener('keydown', function (e) {
      if (e.key === 'Escape') closeLightbox();
    });
  </script>

  <!-- Lightbox -->
  <div id="lightbox" class="hidden" onclick="if(event.target===this)closeLightbox()">
    <button id="lightbox-close" onclick="closeLightbox()" aria-label="關閉">✕</button>
    <img id="lightbox-img" alt="">
  </div>
</body>

</html>
